name: Build APKon:  push:  workflow_dispatch:permissions:  contents: writejobs:  build:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - name: Organizar pastas        run: |          for f in *__*; do            d="${f//__//}"            mkdir -p "$(dirname "$d")"            mv "$f" "$d"          done      - uses: actions/setup-java@v4        with: { distribution: temurin, java-version: 17 }      - uses: gradle/actions/setup-gradle@v3        with: { gradle-version: 8.5 }      - run: gradle assembleDebug      - uses: softprops/action-gh-release@v2        with:          tag_name: latest          name: Meu Launcher          files: app/build/outputs/apk/debug/app-debug.apk
